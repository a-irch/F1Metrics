[project]
name = "backend"
version = "0.1.0"
description = "A cool API for F1Metrics project"
authors = [
    {name = "Rocc Irch",email = "RoccIrch@proton.me"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastf1 (>=3.5.3,<4.0.0)",
    "fastapi (>=0.115.12,<0.116.0)",
    "uvicorn (>=0.34.3,<0.35.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120